<!-- ====================== META PIXEL (629750955135545) ======================
     O mesmo pixel do cardápio. Aqui ele não é só para medir o clique: quando a
     pessoa chega com fbclid (e o Instagram carimba fbclid em TODO clique da bio),
     é o fbevents.js que grava o cookie _fbc no domínio. Como o cardápio roda no
     MESMO domínio, ele lê esse cookie depois e manda no Purchase pelo CAPI.
     Medido em 23/09/2026: a cobertura de fbc no Purchase era 13,5%.
     ========================================================================= -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '629750955135545');
fbq('track', 'PageView');
</script>

<script>
/* ===========================================================================
   1) REPASSE DE ORIGEM.  É o coração desta página.

   O que o Instagram entrega na URL da bio (medido no print de 23/09/2026):
       ?utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAcGRvZgJ...

   O que sai daqui para o cardápio e para o WhatsApp:
   - utm_source=instagram e utm_medium=bio  -> FIXOS. É a convenção JÁ USADA neste
     cliente (o /pedidos carimba isso desde sempre). Não trocar para "link_bio":
     o histórico do dashboard e as consultas do CRM leem "bio".
     O "ig/social" que o Instagram põe sozinho é ignorado de propósito.
   - utm_campaign=link_bio -> padrão, mas o que vier na URL SUBSTITUI. Assim dá para
     criar link de campanha própria: /ig?utm_campaign=story_combinado
   - utm_content=bio_cardapio | bio_whatsapp -> qual BOTÃO foi clicado.
   - fbclid e gclid -> repassados. Este é o furo que a página fecha: o /pedidos
     antigo é um 302! do Netlify, que descarta a query inteira. Medido em
     23/09/2026: /pedidos?...&fbclid=TESTE123 -> Location sem o fbclid.
     Sem fbclid o cardápio não escreve _fbc e o Purchase sai sem fbc (13,5% de
     cobertura, medido em 06/09/2026).
   =========================================================================== */
(function () {
  var p = new URLSearchParams(location.search);
  var campanha = p.get('utm_campaign');
  var ids = {};
  ['fbclid', 'gclid'].forEach(function (k) { var v = p.get(k); if (v) ids[k] = v; });

  document.querySelectorAll('a[data-bt]').forEach(function (a) {
    var bt = a.getAttribute('data-bt');
    // Google e Instagram não leem a nossa origem: não sujar o link.
    if (bt === 'google' || bt === 'instagram') return;
    try {
      var u = new URL(a.href, location.origin);
      if (campanha) u.searchParams.set('utm_campaign', campanha);
      Object.keys(ids).forEach(function (k) { u.searchParams.set(k, ids[k]); });
      a.href = u.toString();
    } catch (e) {}
  });
})();

/* ===========================================================================
   2) external_id ESTÁVEL, compartilhado com o cardápio.

   O cardápio guarda um id anônimo em localStorage('ams_uid') e manda em todo
   evento (tracking.js:33). Como esta página está no MESMO domínio, ela escreve
   a MESMA chave: o clique na bio e a compra de depois chegam no Meta com o
   mesmo external_id, e a jornada costura. Numa bio em domínio separado isso
   seria impossível.
   =========================================================================== */
function externalId() {
  try {
    var v = localStorage.getItem('ams_uid');
    if (!v) {
      v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : Date.now() + '-' + Math.random().toString(36).slice(2);
      localStorage.setItem('ams_uid', v);
    }
    return v;
  } catch (e) { return undefined; }
}

/* ===========================================================================
   3) ClicouBio: um evento por clique, navegador + servidor com o MESMO event_id.

   O servidor vai pela Function /capi que já existe (mesma trava de origem, o
   pixel e o token lidos do banco, e o registro em capi_log). Purchase não passa
   por esse caminho, então não há como forjar venda por aqui.
   keepalive: o request sobrevive à navegação, que acontece no mesmo instante.
   =========================================================================== */
(function () {
  function cookie(n) {
    try { return (document.cookie.match('(^|;)\\s*' + n + '\\s*=\\s*([^;]+)') || [])[2] || null; }
    catch (e) { return null; }
  }
  var uid = externalId();

  document.querySelectorAll('a[data-bt]').forEach(function (el) {
    el.addEventListener('click', function () {
      var bt = el.getAttribute('data-bt');
      var eid = 'bio_' + bt + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

      try { fbq('trackCustom', 'ClicouBio', { content_name: bt, source: 'instagram_bio' }, { eventID: eid }); } catch (e) {}

      try {
        fetch('/.netlify/functions/capi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({
            store: 'acai-mais-sabor',
            event_name: 'clicou_bio',
            event_id: eid,
            content_name: bt,
            external_id: uid,
            event_source_url: location.href,
            fbp: cookie('_fbp') || undefined,
            fbc: cookie('_fbc') || undefined,
            fbclid: new URLSearchParams(location.search).get('fbclid') || undefined
          })
        }).catch(function () {});
      } catch (e) {}
    });
  });
})();
</script>
