<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Açaí Mais Sabor</title>
  <!-- Link ANTIGO da bio do Instagram. Hoje a bio é /ig; este caminho continua vivo
       para quem tiver o link salvo, e a única função dele é levar a pessoa ao /ig
       SEM PERDER NADA da query (fbclid, utm) que o Instagram carimbou.

       Por que não é um 302 no _redirects: medido em 23/09/2026, o Netlify descarta
       a query que chega quando o destino já tem a sua. Aqui o repasse é explícito,
       então não depende do comportamento da plataforma. -->
  <script>
    (function () {
      var q = location.search || '';
      location.replace('/ig' + q + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/ig" /></noscript>
</head>

  Abrindo...
</body>
</html>
